services:
  api_prontocardio:
    image: api_prontocardio
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_ENV: production
      EXPECTED_POSTGRES_HOST: ${EXPECTED_POSTGRES_HOST:?configure o host oficial}
      EXPECTED_POSTGRES_DATABASE: ${EXPECTED_POSTGRES_DATABASE:?configure o banco oficial}
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - api_prontocardio
    restart: unless-stopped

networks:
  api_prontocardio:
    name: ${API_NETWORK_NAME:-api_prontocardio}
