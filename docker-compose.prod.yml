services:
  api_prontocardio:
    image: api_prontocardio
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host-gateway:host-gateway"
    networks:
      - api_prontocardio
    restart: unless-stopped

networks:
  api_prontocardio:
    name: ${API_NETWORK_NAME:-api_prontocardio}
